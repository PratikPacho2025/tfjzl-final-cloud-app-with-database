<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.name }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Online Course</a>
    </nav>

    <div class="container mt-5">
        <h1 class="display-4 font-weight-bold">{{ course.name }}</h1>
        <p class="lead">{{ course.description }}</p>
        
        <hr class="my-4">
        
        <h2 class="mb-4">Course Lessons</h2>
        <div class="list-group">
            {% for lesson in course.lesson_set.all %}
                <div class="list-group-item list-group-item-action flex-column align-items-start mb-3 shadow-sm">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1 font-weight-bold">{{ lesson.title }}</h5>
                        <small>Lesson {{ forloop.counter }}</small>
                    </div>
                    <p class="mb-1 mt-2">{{ lesson.content }}</p>
                </div>
            {% empty %}
                <div class="alert alert-info" role="alert">
                    No lessons available for this course yet.
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
